# Local hooks so tool versions come from uv.lock / frontend/package-lock.json.
# Setup: `uv sync && (cd frontend && npm install) && uv run pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: oxlint
        name: oxlint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(js|jsx)$
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
